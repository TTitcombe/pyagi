[project]
name = "pyagi"
version = "0.1.0"
description = "An AI agent build from scratch in pure, shitty Python."
readme = "README.md"
authors = [
  { name = "tom", email = "hi@tomtitcombe.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ollama>=0.6.2",
    "pyyaml>=6",
    "requests>=2.34.2",
]

[project.scripts]
pyagi = "pyagi.main:main"
bench = "pyagi_bench.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["pyagi", "pyagi_bench"]

[tool.ty.environment]
python = "./.venv"

[dependency-groups]
dev = [
    "pytest>=8",
]
