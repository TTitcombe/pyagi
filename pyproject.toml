[project]
name = "pyagi"
version = "0.1.0"
description = "An AI agent build from scratch in pure, shitty Python."
readme = "README.md"
authors = [
  { name = "tom", email = "hi@tomtitcombe.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ollama>=0.6.2",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tavily-python>=0.8.5",
]

[project.scripts]
pyagi = "pyagi.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["pyagi", "pyagi_evals"]

[tool.ty.environment]
python = "./.venv"

[dependency-groups]
dev = [
    "harbor==0.24.0",
]
