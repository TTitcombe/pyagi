[project]
name = "pyagi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
  { name = "tom", email = "hi@tomtitcombe.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ollama>=0.6.2",
    "requests>=2.34.2",
]

