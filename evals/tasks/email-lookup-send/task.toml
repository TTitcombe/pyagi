[task]
name = "pyagi/email-lookup-send"

[metadata]
family = "email"
outcome = "do"      # do | answer | ask | refuse
steps = "short"
split = "dev"         # dev | heldout

[agent]
timeout_sec = 300.0

[environment]
# Shared starting state (evals/base). The environment/ dir stays empty but must exist.
docker_image = "pyagi-evals-base:local"
network_mode = "no-network"
