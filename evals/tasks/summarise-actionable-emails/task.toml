[task]
name = "pyagi/summarise-actionable-emails"

[metadata]
family = "email"
outcome = "answer"    # do | answer | ask | refuse
steps = "medium"
split = "dev"         # dev | heldout
grader = "checker+judge"  # the checker covers which emails and deadlines; summary quality needs the A2 judge

[agent]
timeout_sec = 600.0

[environment]
# Shared starting state (evals/base). The environment/ dir stays empty but must exist.
docker_image = "pyagi-evals-base:local"
network_mode = "no-network"
