# docker compose build --build-arg GIT_SHA=$(git rev-parse HEAD)
# docker compose run --rm bench validate
# docker compose run --rm bench run -c configs/baseline.yaml --split dev --trials 4
services:
  bench:
    build: .
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux; built in on Docker Desktop
    volumes:
      - ./runs:/app/runs
      # Edit tasks/configs without rebuilding. The world is read-only to the container;
      # each trial gets a fresh in-memory copy anyway.
      - ./benchmark:/app/benchmark:ro
      - ./configs:/app/configs:ro

  # Optional in-container Ollama for Linux + NVIDIA hosts:
  #   OLLAMA_URL=http://ollama:11434 docker compose --profile ollama run --rm bench ...
  ollama:
    image: ollama/ollama
    profiles: [ollama]
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

volumes:
  ollama:
