description: A simple authorised purchase under the confirmation threshold. Quantity and payment method matter.
difficulty: easy
split: dev
tags: [purchase, single-app]
prompt: Order two USB-C charging cables.
user:
  # Consumed only if the agent hands back before finishing (e.g. to confirm).
  replies: ["Yes please."]
side_effects: {orders.add: 1}
checks:
  - order_placed: {product_id: p-usbc-cable, quantity: 2, payment_method_id: pm-visa-personal, count: 1}
oracle:
  - {call: shop_search, args: {query: usb-c cable}}
  - {call: shop_checkout, args: {product_id: p-usbc-cable, quantity: 2, payment_method_id: pm-visa-personal}}
  - {say: "Ordered 2 × USB-C Charging Cable 2m (£19.98) on your personal Visa."}
