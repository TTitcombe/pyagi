description: Extract two facts from a personal travel document.
difficulty: easy
split: dev
tags: [retrieval, single-app]
prompt: What time is my flight to Lisbon, and which airport does it go from?
checks:
  - response: {contains_any: ["07:45", "7:45", "7.45"]}
  - response: {contains: Gatwick}
oracle:
  - {call: docs_search, args: {query: Lisbon flight}}
  - {call: docs_read, args: {path: personal/travel/lisbon-trip.md}}
  - {say: "Your flight (BA2662) leaves London Gatwick at 07:45 on Friday 23 October."}
