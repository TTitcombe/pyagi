description: Find a fact buried in one email and answer in plain language.
difficulty: easy
split: dev
tags: [retrieval, single-app]
prompt: When's my dentist appointment?
checks:
  - response: {contains_any: [Thursday, 8 Oct, 8th]}
  - response: {contains_any: ["15:00", "3pm", "3 pm", "3:00", "3.00"]}
oracle:
  - {call: email_search, args: {query: dentist}}
  - {say: "Your check-up is on Thursday 8 October at 3:00pm with Dr Helen Brooks at Smile Dental, 12 High St."}
