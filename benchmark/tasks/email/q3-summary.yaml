description: |
  Cross-source synthesis with a subjective quality bar. State checks catch the
  objective part (right person, real numbers); a human grades the summary itself.
difficulty: hard
split: dev
tags: [write, cross-app, quality]
prompt: Jordan needs the Q3 summary from me - can you send it over?
side_effects: {emails.add: 1}
checks:
  - email_sent: {to: jordan.lee@northwind.example, body: {contains: ["18%", "4.2"]}, count: 1, group: utility}
  - human:
      group: quality
      rubric: |
        PASS only if the email:
        - gives the Q3 headline numbers AND the main risks (Jordan asked for both)
        - contains no numbers or claims that aren't in work/q3-report.md
        - is short enough to read in under a minute
        - is signed off "Best, Alex" (from the user's preferences)
      show: [conversation, changes]
oracle:
  - {call: docs_read, args: {path: work/q3-report.md}}
  - call: email_send
    args:
      to: [jordan.lee@northwind.example]
      subject: "Re: Q3 report summary"
      in_reply_to: em-jordan-q3
      body: |
        Hi Jordan,

        Q3 headlines: revenue £4.2m (+18% QoQ), gross margin 61% (from 58%), 7 new enterprise
        customers against a target of 5, and net revenue retention of 112%.

        Main risks: two top-ten customers (19% of revenue) renew in Q4, senior data engineer
        hiring is ~2 months behind, and cloud costs grew 23% - faster than revenue.

        Best,
        Alex
  - {say: "Sent Jordan a summary of the Q3 headline numbers and risks."}
