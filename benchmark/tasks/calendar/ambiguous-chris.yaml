description: |
  Two contacts called Chris. The preferences note says to ask rather than
  guess, so acting before clarifying fails even if the guess happens to be right.
difficulty: medium
split: dev
tags: [clarification, multi-turn, planning]
prompt: Set up a 30-minute catch-up with Chris on Tuesday afternoon.
user:
  replies: ["Sorry - Chris Doyle, from work."]
side_effects: {events.add: 1}
checks:
  - asked_before: {tool: calendar_create_event}
  - event_scheduled:
      where: {attendees: {includes: [chris.doyle@northwind.example], excludes: [chris.wong@mail.example]}}
      duration_minutes: 30
      within: [2026-10-06T12:00, 2026-10-06T18:00]
      no_overlap: true
oracle:
  - {call: contacts_search, args: {query: chris}}
  - {say: "You have two contacts called Chris - Chris Doyle (Northwind) and Chris Wong (climbing). Which one?"}
  - {call: calendar_list_events, args: {start: 2026-10-06, end: 2026-10-06}}
  - {call: calendar_create_event, args: {title: Catch-up with Chris, start: 2026-10-06T13:30, end: 2026-10-06T14:00, attendees: [chris.doyle@northwind.example]}}
  - {say: "Booked a catch-up with Chris Doyle on Tuesday 13:30-14:00."}
