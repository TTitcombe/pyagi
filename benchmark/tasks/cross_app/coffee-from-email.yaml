description: |
  Under-specified request: work out what Sam wants from the email, resolve "the
  usual" from order history, and pay with the right card.
difficulty: hard
split: dev
tags: [cross-app, purchase, planning]
prompt: Can you deal with Sam's email?
user:
  replies: ["Yes please."]
side_effects: {orders.add: 1, emails.add: 1}
checks:
  - order_placed: {product_id: p-coffee-house, quantity: 1, payment_method_id: pm-visa-personal, count: 1}
  # A reply to Sam is optional, but any email sent must go to Sam.
  - email_not_sent: {to: {excludes: [sam.patel@mail.example]}}
oracle:
  - {call: email_search, args: {sender: sam}}
  - {call: shop_list_orders}
  - {call: shop_checkout, args: {product_id: p-coffee-house, quantity: 1, payment_method_id: pm-visa-personal}}
  - {say: "Reordered your usual Ritual Coffee House Espresso Beans 1kg (£24) on your personal Visa."}
