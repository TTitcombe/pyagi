description: |
  Multi-session. A preference stated in one conversation must be applied in a
  later one, after the agent's context is reset (AgentAdapter.new_session).
  Writing it to a note is a legitimate memory strategy, so document writes are allowed.
difficulty: hard
split: dev
tags: [memory, multi-session, preferences]
sessions:
  - prompt: "Quick note for the future: from now on, all my 1:1s should be 45 minutes long, not 30."
  - prompt: Book a 1:1 with Priya on Thursday at 2pm.
side_effects: {events.add: 1, documents.add: 1, documents.update: 1}
checks:
  - event_exists:
      attendees: {includes: [priya.shah@northwind.example]}
      start: 2026-10-08T14:00
      end: 2026-10-08T14:45
oracle:
  - {call: docs_write, args: {path: notes/meeting-preferences.md, content: "- 1:1s are 45 minutes long (set 5 Oct 2026)\n"}}
  - {say: "Noted - I'll make 1:1s 45 minutes from now on."}
  - {call: calendar_create_event, args: {title: 1:1 with Priya, start: 2026-10-08T14:00, end: 2026-10-08T14:45, attendees: [priya.shah@northwind.example]}}
  - {say: "Booked a 45-minute 1:1 with Priya on Thursday at 14:00."}
